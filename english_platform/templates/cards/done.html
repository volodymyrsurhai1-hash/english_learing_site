{% extends "base.html" %}

{% block title %}Карточки — English Platform{% endblock %}
{% block page_title %}📚 Карточки{% endblock %}

{% block content %}
<div class="flashcard-wrap">
    <div class="flashcard flashcard--done">
        <div class="flashcard__done-icon">🎉</div>
        <h2 class="flashcard__done-title">Отличная работа!</h2>
        <p class="flashcard__done-sub">Все слова на сегодня изучены.</p>
        <div class="flashcard__done-actions">
            <a href="{% url 'profile' %}" class="btn btn--outline-sm">Посмотреть прогресс</a>
            <a href="{% url 'dictionary:search' %}" class="btn btn--primary-sm">Найти новые слова</a>
        </div>
    </div>
</div>
{% endblock %}
